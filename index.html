<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Daily Space Image Viewer</title>
    <meta
      name="description"
      content="Deep-space themed interface loading NASA's Astronomy Picture of the Day with celestial gallery, 90 twinkling stars, HD viewing, and personal vault archive."
    />
    <meta property="og:title" content="NASA Daily Space Image Viewer" />
    <meta
      property="og:description"
      content="Deep-space themed interface loading NASA's Astronomy Picture of the Day with celestial gallery, 90 twinkling stars, HD viewing, and personal vault archive."
    />
    <script>
      // Global suppression of harmless cross-origin frame access errors from sandboxed media embeds
      window.addEventListener(
        'error',
        function (e) {
          var msg =
            e && e.message
              ? e.message
              : e && e.error && e.error.message
              ? e.error.message
              : '';
          if (
            typeof msg === 'string' &&
            (msg.indexOf('cross-origin frame') !== -1 ||
              msg.indexOf("'origin' from 'Location'") !== -1 ||
              msg.indexOf('SecurityError') !== -1)
          ) {
            e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            return true;
          }
        },
        true
      );
      window.addEventListener('unhandledrejection', function (e) {
        var reason =
          e && e.reason ? e.reason.message || String(e.reason) : '';
        if (
          typeof reason === 'string' &&
          (reason.indexOf('cross-origin frame') !== -1 ||
            reason.indexOf("'origin' from 'Location'") !== -1 ||
            reason.indexOf('SecurityError') !== -1)
        ) {
          e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
